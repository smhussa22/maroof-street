# for ./start dev: the services run directly on this machine, Prometheus runs in Docker
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway-http
    metrics_path: /metrics/
    static_configs: [{ targets: ["host.docker.internal:8080"] }]
  - job_name: ledger
    static_configs: [{ targets: ["host.docker.internal:9101"] }]
  - job_name: market-data
    static_configs: [{ targets: ["host.docker.internal:9102"] }]
