apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data
  namespace: maroof-street
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-data
  template:
    metadata:
      labels:
        app: market-data
    spec:
      containers:
        - name: market-data
          image: ghcr.io/smhussa22/maroof-street/market-data:latest
          ports:
            - containerPort: 50052
          env:
            - name: GRPC_LISTEN
              value: "0.0.0.0:50052"
          envFrom:
            - configMapRef:
                name: exchange-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: market-data
  namespace: maroof-street
spec:
  type: ClusterIP
  selector:
    app: market-data
  ports:
    - port: 50052
      targetPort: 50052
