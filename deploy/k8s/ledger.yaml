apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: maroof-street
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
        - name: ledger
          image: ghcr.io/smhussa22/maroof-street/ledger:latest
          envFrom:
            - configMapRef:
                name: exchange-config
            - secretRef:
                name: exchange-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
