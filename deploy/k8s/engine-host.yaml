apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-host-aapl
  namespace: maroof-street
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engine-host
      symbol: AAPL
  template:
    metadata:
      labels:
        app: engine-host
        symbol: AAPL
    spec:
      containers:
        - name: engine-host
          image: ghcr.io/smhussa22/maroof-street/engine-host:latest
          env:
            - name: SYMBOL
              value: "AAPL"
          envFrom:
            - configMapRef:
                name: exchange-config
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "512Mi"
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 1
                  preference:
                    matchExpressions:
                      - key: node.kubernetes.io/instance-type
                        operator: In
                        values: ["c6i.xlarge", "c6i.2xlarge"]
---
