apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-maker
  namespace: maroof-street
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-maker
  template:
    metadata:
      labels:
        app: market-maker
    spec:
      containers:
        - name: market-maker
          image: ghcr.io/smhussa22/maroof-street/bots:latest
          command: ["python3", "market_maker.py"]
          env:
            - name: MM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: exchange-secrets
                  key: MM_API_KEY
          envFrom:
            - configMapRef:
                name: exchange-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
